<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&D Party Scheduler</title>
<style>
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #e4e0d8;
    --text: #2b2622;
    --text-dim: #6f665c;
    --accent: #7a2e2e;
    --accent-dim: #a94b4b;
    --cant: #d9534f;
    --maybe: #e0a63b;
    --works: #4a8a5c;
    --track-bg: #f1efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a17; --surface: #262320; --border: #3a352f; --text: #ede8e0;
      --text-dim: #a89f92; --accent: #d97b7b; --accent-dim: #b85c5c;
      --cant: #e07b78; --maybe: #e6b95c; --works: #6fbf82; --track-bg: #2f2b26;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a17; --surface: #262320; --border: #3a352f; --text: #ede8e0;
    --text-dim: #a89f92; --accent: #d97b7b; --accent-dim: #b85c5c;
    --cant: #e07b78; --maybe: #e6b95c; --works: #6fbf82; --track-bg: #2f2b26;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Georgia, serif;
    padding: 20px 14px 60px; max-width: 720px; margin: 0 auto;
  }
  h1 { font-size: 1.4rem; margin: 4px 0 2px; color: var(--accent); }
  .sub { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 20px; }
  section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  section h2 { font-size: 1rem; margin: 0 0 12px; color: var(--text); }
  label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 4px; }
  input[type="text"], input[type="date"], input[type="month"], select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--bg); color: var(--text);
    font-size: 0.95rem; margin-bottom: 10px;
  }
  button {
    background: var(--accent); color: #fff; border: none; padding: 9px 16px;
    border-radius: 6px; font-size: 0.9rem; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary {
    background: transparent; color: var(--accent-dim); border: 1px solid var(--border);
    padding: 4px 10px; font-size: 0.75rem;
  }
  .slot-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .slot-row-label { flex: 1; font-size: 0.9rem; }
  .add-slot-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .add-slot-grid .full { grid-column: 1 / -1; }
  .vote-slot { border-bottom: 1px solid var(--border); padding: 10px 0; }
  .vote-slot:last-child { border-bottom: none; }
  .vote-slot-label { font-size: 0.9rem; margin-bottom: 8px; font-weight: 600; }
  .vote-buttons { display: flex; gap: 6px; }
  .vote-btn {
    flex: 1; padding: 8px 4px; border-radius: 6px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--text-dim); font-size: 0.78rem;
    text-align: center; cursor: pointer;
  }
  .vote-btn.active-cant { background: var(--cant); border-color: var(--cant); color: #fff; }
  .vote-btn.active-maybe { background: var(--maybe); border-color: var(--maybe); color: #fff; }
  .vote-btn.active-works { background: var(--works); border-color: var(--works); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
  .bar-wrap { background: var(--track-bg); border-radius: 4px; height: 8px; overflow: hidden; margin-top: 4px; }
  .bar { height: 100%; background: var(--works); }
  .rank-1 td:first-child { color: var(--works); font-weight: 700; }
  .result-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    background: var(--bg);
  }
  .result-card.top { border-color: var(--works); border-width: 2px; }
  .result-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; margin-bottom: 4px;
  }
  .result-title { font-weight: 700; font-size: 0.92rem; }
  .tier {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 2px 7px; border-radius: 10px; white-space: nowrap;
  }
  .tier-clear { background: var(--works); color: #fff; }
  .tier-partial { background: var(--maybe); color: #fff; }
  .tier-veto { background: var(--cant); color: #fff; }
  .result-avg { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 8px; }
  .result-count { opacity: 0.75; }
  .vgroup {
    display: flex; gap: 8px; align-items: baseline;
    font-size: 0.8rem; margin-top: 4px;
  }
  .vlabel {
    flex-shrink: 0; width: 118px; font-weight: 600; font-size: 0.72rem;
  }
  .g-works { color: var(--works); }
  .g-maybe { color: var(--maybe); }
  .g-cant { color: var(--cant); }
  .g-novote { color: var(--text-dim); }
  .vnames { color: var(--text); }
  .status { font-size: 0.75rem; color: var(--text-dim); margin-top: 6px; }
  .empty { color: var(--text-dim); font-size: 0.85rem; font-style: italic; }
  .respondents { font-size: 0.78rem; color: var(--text-dim); margin-top: 10px; }
  .gate-wrap {
    max-width: 360px; margin: 60px auto; text-align: center;
  }
  .gate-wrap h1 { text-align: center; }
  .gate-error { color: var(--cant); font-size: 0.85rem; margin-top: 6px; min-height: 1em; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
  }
  .topbar .who { font-size: 0.85rem; color: var(--text-dim); }
  .hidden { display: none !important; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 100;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px; max-width: 380px; width: 100%;
  }
  .modal-title { font-weight: 700; font-size: 1rem; margin-bottom: 8px; color: var(--accent); }
  .modal-message { font-size: 0.88rem; color: var(--text); line-height: 1.45; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions button { padding: 8px 14px; font-size: 0.85rem; }
  .modal-actions #modalOk { background: var(--cant); }
</style>
</head>
<body>

  <div id="gateScreen" class="gate-wrap">
    <h1>D&D Party Scheduler</h1>
    <div class="sub">Enter your name to continue.</div>
    <input type="text" id="gateNameInput" placeholder="Your name" autocomplete="off">
    <button id="gateSubmitBtn" style="width:100%;">Enter</button>
    <div class="gate-error" id="gateError"></div>
  </div>

  <div id="appScreen" class="hidden">
    <div class="topbar">
      <h1 style="margin:0;">D&D Party Scheduler</h1>
      <span class="who" id="whoLine"></span>
    </div>
    <div class="sub">Select a month, add slots, and vote. Results update live.</div>

    <section>
      <h2>Month</h2>
      <input type="month" id="monthPicker">
    </section>

    <section id="setupSection">
      <h2>Time slots this month</h2>
      <div id="slotList"></div>
      <div class="add-slot-grid">
        <div class="full">
          <label>Date</label>
          <input type="date" id="newSlotDate">
        </div>
        <div>
          <label>Start time</label>
          <select id="newSlotStart"></select>
        </div>
        <div>
          <label>End time</label>
          <select id="newSlotEnd"></select>
        </div>
        <div class="full">
          <button id="addSlotBtn" style="width:100%;">Add slot</button>
          <div class="status" id="slotStatus"></div>
        </div>
      </div>
    </section>

    <section id="voteSection">
      <h2>Your availability</h2>
      <div id="voteSlots"></div>
      <button id="saveBtn" style="margin-top:10px;">Save my votes</button>
      <div class="status" id="saveStatus"></div>
    </section>

    <section id="resultsSection">
      <h2>Best days this month</h2>
      <div id="resultsTable"></div>
      <div class="respondents" id="respondentsLine"></div>
    </section>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-message" id="modalMessage"></div>
      <div class="modal-actions">
        <button class="secondary" id="modalCancel">Cancel</button>
        <button id="modalOk">Remove</button>
      </div>
    </div>
  </div>

<script>
// SHA-256 hashes of allowed player names (lowercased, trimmed) -- not stored as plaintext.
const ALLOWED_HASHES = [
  "119fc49dcf5baba49278e04e8848055ac5ba1ef0e1fca7a72ba00ee24af7e228".slice(0,64),
  "05aaf453cf1427269096562fd46c9a059d6894fc5971d11b7d5173dc99f65e12".slice(0,64),
  "40806e90f61210afdd7e0fc10f59e43c7a85c27bbe14edccc636bb4e2994489e".slice(0,64),
  "5c95c28cc040c651514ec16451b60fe668c8ffbcb82127a3f7a0885598c39414".slice(0,64),
  "4d30c878c44ec3d52deb0318ae71d9a9b7a91391a46a9d704697570af06426f0".slice(0,64),
  "f89767726a7827c6f785b40aee1ca2ade74d951d6a2d50e27cc0f0e5072a12b2".slice(0,64)
];

let db = null;
let slots = [];
let roster = [];
let responses = {};
let currentVotes = {};
let currentName = "";
let selectedMonth = "";

const VOTE_LEVELS = [
  { key: "cant", label: "Can't", score: 0, cls: "active-cant" },
  { key: "maybe", label: "Can make it work", score: 1, cls: "active-maybe" },
  { key: "works", label: "Works!", score: 2, cls: "active-works" }
];

async function sha256Hex(str) {
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function slugName(name) {
  return name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

function fmtDateShort(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

function timeOptions() {
  const opts = [];
  for (let mins = 0; mins < 24 * 60; mins += 30) {
    let h = Math.floor(mins / 60);
    const m = mins % 60;
    const ampm = h < 12 ? "AM" : "PM";
    let h12 = h % 12;
    if (h12 === 0) h12 = 12;
    const label = `${h12}:${m.toString().padStart(2, "0")} ${ampm}`;
    opts.push({ value: mins, label });
  }
  return opts;
}
const TIME_OPTS = timeOptions();

function populateTimeSelects() {
  const startSel = document.getElementById("newSlotStart");
  const endSel = document.getElementById("newSlotEnd");
  startSel.innerHTML = TIME_OPTS.map(o => `<option value="${o.value}">${o.label}</option>`).join("");
  endSel.innerHTML = TIME_OPTS.map(o => `<option value="${o.value}">${o.label}</option>`).join("");
  startSel.value = 18 * 60;       // default 6:00 PM
  endSel.value = 21 * 60;         // default 9:00 PM
}

function minsToLabel(mins) {
  return TIME_OPTS.find(o => o.value === Number(mins))?.label || "";
}

function currentMonthStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

// ---------- Gate ----------
async function tryLogin(name) {
  const errEl = document.getElementById("gateError");
  const trimmed = (name || "").trim();
  if (!trimmed) { errEl.textContent = "Enter a name."; return; }
  const hash = await sha256Hex(trimmed.toLowerCase());
  if (!ALLOWED_HASHES.includes(hash)) {
    errEl.textContent = "That name isn't recognized.";
    return;
  }
  currentName = trimmed;
  localStorage.setItem("dnd_scheduler_name", trimmed);
  showApp();
}

function showApp() {
  document.getElementById("gateScreen").classList.add("hidden");
  document.getElementById("appScreen").classList.remove("hidden");
  document.getElementById("whoLine").textContent = currentName;
  init();
}

// ---------- App ----------
async function init() {
  db = await claude.use("db");
  if (!db) {
    document.getElementById("appScreen").innerHTML = "<p>This page needs the shared data feature, which isn't available in this view.</p>";
    return;
  }

  populateTimeSelects();

  selectedMonth = localStorage.getItem("dnd_scheduler_month") || currentMonthStr();
  const monthPicker = document.getElementById("monthPicker");
  monthPicker.value = selectedMonth;
  monthPicker.addEventListener("change", () => {
    selectedMonth = monthPicker.value;
    localStorage.setItem("dnd_scheduler_month", selectedMonth);
    setDateBoundsForMonth();
    renderSlotList();
    renderVoteSlots();
    renderResults();
  });
  setDateBoundsForMonth();

  db.collection("roster").onSnapshot((snap) => {
    roster = snap.docs
      .filter(d => d.exists)
      .map(d => ({ id: d.id, ...(d.data() || {}) }))
      .sort((a, b) => (a.order || 0) - (b.order || 0));
    renderResults();
  }, (e) => {
    console.error("roster subscription error", e);
  });

  db.collection("slots").onSnapshot((snap) => {
    slots = snap.docs
      .filter(d => d.exists)
      .map(d => ({ id: d.id, ...(d.data() || {}) }))
      .sort((a, b) => a.order - b.order);
    renderSlotList();
    renderVoteSlots();
    renderResults();
  }, (e) => {
    console.error("slots subscription error", e);
    document.getElementById("slotList").innerHTML =
      '<div class="empty">Couldn\'t load slots. Reload the page.</div>';
  });

  db.collection("responses").onSnapshot((snap) => {
    responses = {};
    snap.docs.forEach(d => {
      if (d.exists) responses[d.id] = d.data() || {};
    });
    const myId = slugName(currentName);
    if (responses[myId]) currentVotes = { ...(responses[myId].votes || {}) };
    renderVoteSlots();
    renderResults();
  }, (e) => {
    console.error("responses subscription error", e);
  });

  document.getElementById("addSlotBtn").addEventListener("click", addSlot);
  document.getElementById("saveBtn").addEventListener("click", saveVotes);
}

function setDateBoundsForMonth() {
  const [y, m] = selectedMonth.split("-").map(Number);
  const first = `${selectedMonth}-01`;
  const lastDay = new Date(y, m, 0).getDate();
  const last = `${selectedMonth}-${String(lastDay).padStart(2, "0")}`;
  const dateInput = document.getElementById("newSlotDate");
  dateInput.min = first;
  dateInput.max = last;
  dateInput.value = first;
}

function slotsInSelectedMonth() {
  return slots.filter(s => s.month === selectedMonth);
}

async function addSlot() {
  const statusEl = document.getElementById("slotStatus");
  const dateVal = document.getElementById("newSlotDate").value;
  const startVal = Number(document.getElementById("newSlotStart").value);
  const endVal = Number(document.getElementById("newSlotEnd").value);
  statusEl.textContent = "";

  if (!dateVal) { statusEl.textContent = "Pick a date first."; return; }
  if (!dateVal.startsWith(selectedMonth)) {
    statusEl.textContent = "That date isn't in the selected month.";
    return;
  }
  if (endVal <= startVal) {
    statusEl.textContent = "End time must be after start time.";
    return;
  }

  const label = `${fmtDateShort(dateVal)} \u2022 ${minsToLabel(startVal)} \u2013 ${minsToLabel(endVal)}`;
  const id = `${dateVal}-${startVal}-${endVal}`;
  const order = new Date(dateVal).getTime() + startVal * 60000;
  try {
    await db.doc(`slots/${id}`).set({
      label, order, date: dateVal, month: selectedMonth, start: startVal, end: endVal
    });
    statusEl.textContent = "Slot added.";
  } catch (e) {
    console.error("add slot failed", e);
    statusEl.textContent = "Couldn't add slot \u2014 try again.";
  }
}

function confirmDialog(title, message) {
  return new Promise(resolve => {
    const overlay = document.getElementById("modalOverlay");
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalMessage").textContent = message;
    overlay.classList.remove("hidden");

    const okBtn = document.getElementById("modalOk");
    const cancelBtn = document.getElementById("modalCancel");

    function cleanup(result) {
      overlay.classList.add("hidden");
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      overlay.removeEventListener("click", onBackdrop);
      document.removeEventListener("keydown", onKey);
      resolve(result);
    }
    function onOk() { cleanup(true); }
    function onCancel() { cleanup(false); }
    function onBackdrop(e) { if (e.target === overlay) cleanup(false); }
    function onKey(e) { if (e.key === "Escape") cleanup(false); }

    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
    overlay.addEventListener("click", onBackdrop);
    document.addEventListener("keydown", onKey);
  });
}

async function removeSlot(id) {
  const slot = slots.find(s => s.id === id);
  const label = slot ? slot.label : "this slot";
  const voters = Object.values(responses).filter(r => r.votes && id in r.votes);
  const warning = voters.length > 0
    ? ` ${voters.length} ${voters.length === 1 ? "person has" : "people have"} already voted on it; those votes will be deleted.`
    : "";

  const ok = await confirmDialog("Remove this slot?", `${label}.${warning}`);
  if (!ok) return;

  const statusEl = document.getElementById("slotStatus");
  try {
    // Strip this slot from every stored response, then delete the slot itself.
    for (const [docId, r] of Object.entries(responses)) {
      if (!r.votes || !(id in r.votes)) continue;
      const cleaned = { ...r.votes };
      delete cleaned[id];
      await db.doc(`responses/${docId}`).set({
        name: r.name, votes: cleaned, updatedAt: Date.now()
      });
    }
    delete currentVotes[id];
    await db.doc(`slots/${id}`).delete();
    statusEl.textContent = "Slot removed.";
  } catch (e) {
    console.error("remove slot failed", e);
    statusEl.textContent = "Couldn't remove slot \u2014 try again.";
  }
}

function renderSlotList() {
  const el = document.getElementById("slotList");
  const monthSlots = slotsInSelectedMonth();
  if (monthSlots.length === 0) {
    el.innerHTML = '<div class="empty">No slots yet this month — add one below.</div>';
    return;
  }
  el.innerHTML = "";
  monthSlots.forEach(s => {
    const row = document.createElement("div");
    row.className = "slot-row";
    row.innerHTML = `<div class="slot-row-label">${s.label}</div>`;
    const btn = document.createElement("button");
    btn.className = "secondary";
    btn.textContent = "Remove";
    btn.addEventListener("click", () => removeSlot(s.id));
    row.appendChild(btn);
    el.appendChild(row);
  });
}

function renderVoteSlots() {
  const el = document.getElementById("voteSlots");
  const monthSlots = slotsInSelectedMonth();
  if (monthSlots.length === 0) {
    el.innerHTML = '<div class="empty">Add slots above first.</div>';
    return;
  }
  el.innerHTML = "";
  monthSlots.forEach(s => {
    const wrap = document.createElement("div");
    wrap.className = "vote-slot";
    const labelDiv = document.createElement("div");
    labelDiv.className = "vote-slot-label";
    labelDiv.textContent = s.label;
    wrap.appendChild(labelDiv);

    const btnRow = document.createElement("div");
    btnRow.className = "vote-buttons";
    VOTE_LEVELS.forEach(level => {
      const b = document.createElement("div");
      b.className = "vote-btn" + (currentVotes[s.id] === level.score ? " " + level.cls : "");
      b.textContent = level.label;
      b.addEventListener("click", () => {
        currentVotes[s.id] = level.score;
        renderVoteSlots();
      });
      btnRow.appendChild(b);
    });
    wrap.appendChild(btnRow);
    el.appendChild(wrap);
  });
}

async function saveVotes() {
  const statusEl = document.getElementById("saveStatus");
  const monthSlots = slotsInSelectedMonth();
  if (monthSlots.length === 0) {
    statusEl.textContent = "No slots to vote on this month.";
    return;
  }
  const missing = monthSlots.filter(s => !(s.id in currentVotes));
  if (missing.length > 0) {
    statusEl.textContent = `Please vote on all slots this month (${missing.length} left).`;
    return;
  }
  const id = slugName(currentName);
  try {
    await db.doc(`responses/${id}`).set({ name: currentName, votes: currentVotes, updatedAt: Date.now() });
    statusEl.textContent = "Saved.";
  } catch (e) {
    statusEl.textContent = "Couldn't save \u2014 try again.";
    console.error(e);
  }
}

// Veto players are flagged in the shared roster data, not hardcoded here.

function renderResults() {
  const el = document.getElementById("resultsTable");
  const respLine = document.getElementById("respondentsLine");
  const monthSlots = slotsInSelectedMonth();

  // Every roster member is counted, whether or not they've ever opened the page.
  const players = roster.length > 0
    ? roster.map(m => ({ id: m.id, name: m.name, veto: !!m.veto }))
    : Object.entries(responses).map(([id, r]) => ({ id, name: r.name, veto: false }));

  const votedNames = players
    .filter(p => responses[p.id] && responses[p.id].votes
      && monthSlots.some(s => s.id in responses[p.id].votes))
    .map(p => p.name);
  respLine.textContent = votedNames.length
    ? `Voted this month: ${votedNames.join(", ")} (${votedNames.length}/${players.length})`
    : `No votes yet this month (0/${players.length}).`;

  if (monthSlots.length === 0) {
    el.innerHTML = '<div class="empty">Add slots and get votes to see results.</div>';
    return;
  }

  const rows = monthSlots.map(s => {
    const works = [], maybe = [], cant = [], novote = [];
    let total = 0, answered = 0, vetoed = false;

    players.forEach(p => {
      const r = responses[p.id];
      const v = r && r.votes ? r.votes[s.id] : undefined;
      if (v === undefined) {
        // A missing vote scores as neutral (1), so non-responses neither
        // help nor hurt a slot, and every slot shares the same denominator.
        novote.push(p.name);
        total += 1;
        return;
      }
      answered++;
      total += v;
      if (v === 2) works.push(p.name);
      else if (v === 1) maybe.push(p.name);
      else {
        cant.push(p.name);
        if (p.veto) vetoed = true;
      }
    });

    const avg = players.length > 0 ? total / players.length : 0;
    return { slot: s, works, maybe, cant, novote, answered, avg,
             players: players.length, zeros: cant.length, vetoed };
  });

  // Ranking: veto slots to the absolute bottom; otherwise tier by number of
  // "Can't" votes (0 zeros first, then 1, then 2, ...), and within each tier
  // sort by average score descending.
  rows.sort((a, b) => {
    if (a.vetoed !== b.vetoed) return a.vetoed ? 1 : -1;
    if (a.zeros !== b.zeros) return a.zeros - b.zeros;
    if (b.avg !== a.avg) return b.avg - a.avg;
    return a.slot.order - b.slot.order;
  });

  let html = "";
  rows.forEach((r, i) => {
    const isTop = i === 0 && r.answered > 0 && !r.vetoed;
    const tierLabel = r.vetoed
      ? "Vetoed"
      : r.zeros === 0
        ? "All clear"
        : `${r.zeros} can't`;
    const tierCls = r.vetoed ? "tier-veto" : r.zeros === 0 ? "tier-clear" : "tier-partial";

    html += `<div class="result-card${isTop ? " top" : ""}">
      <div class="result-head">
        <div class="result-title">${r.slot.label}</div>
        <span class="tier ${tierCls}">${tierLabel}</span>
      </div>
      <div class="result-avg">Avg ${r.avg.toFixed(2)} / 2.00
        <span class="result-count">(${r.answered}/${r.players} voted)</span>
      </div>
      ${voterGroup("Works", r.works, "g-works")}
      ${voterGroup("Can make it work", r.maybe, "g-maybe")}
      ${voterGroup("Can't", r.cant, "g-cant")}
      ${voterGroup("No vote", r.novote, "g-novote")}
    </div>`;
  });
  el.innerHTML = html;
}

function voterGroup(label, names, cls) {
  if (names.length === 0) return "";
  return `<div class="vgroup">
    <span class="vlabel ${cls}">${label}</span>
    <span class="vnames">${names.join(", ")}</span>
  </div>`;
}

// ---------- Boot ----------
document.getElementById("gateSubmitBtn").addEventListener("click", () => {
  tryLogin(document.getElementById("gateNameInput").value);
});
document.getElementById("gateNameInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") tryLogin(document.getElementById("gateNameInput").value);
});

const savedName = localStorage.getItem("dnd_scheduler_name");
if (savedName) {
  sha256Hex(savedName.trim().toLowerCase()).then(h => {
    if (ALLOWED_HASHES.includes(h)) {
      currentName = savedName;
      showApp();
    }
  });
}
